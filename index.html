      return { id: emp.id, name: emp.name, pin: emp.pin, is_logged_in: emp.isLoggedIn,

        break_threshold: emp.breakThreshold, break_duration: emp.breakDuration,

      return { id: r.id, employeeId: r.employee_id, employeeName: r.employee_name,
        type: r.type, timestamp: r.timestamp, location: r.location||'restaurant',
        forceBreakOverride: r.force_break_override };
    }

      return { id: r.id, employee_id: r.employeeId, employee_name: r.employeeName,

        force_break_override: r.forceBreakOverride !== undefined ? r.forceBreakOverride : null };

    var DB = {

          SB.from('punch_records').select('*').order('timestamp', {ascending:false}),
          SB.from('employee_messages').select('*').order('date', {ascending:false}),

      deletePendingAlert: function(id) {
        return SB.from('pending_alerts').delete().eq('id', id);

            if (period.toUpperCase() === 'PM' && hours !== 12) {

        employees.forEach(emp => {

          if (selectedTipsEmployees[emp.id] === false) return;
          
          const empSheets = getEmployeeTimeSheetsForPeriod(emp.id, start, end, true); // restaurant seulement
          
          if (empSheets.length > 0) {
            let totalHours = 0;
            let totalPoints = 0;
            
            empSheets.forEach(sheet => {
              const inTime = new Date(sheet.inRecord.timestamp);
              const outTime = new Date(sheet.outRecord.timestamp);
              const hours = (outTime - inTime) / (1000 * 60 * 60);
              
              const breakThreshold = emp.breakThreshold || 5;
              const breakDuration = emp.breakDuration || 30;
              const breakApplied = hours >= breakThreshold;
              const workHours = breakApplied ? hours - (breakDuration / 60) : hours;
              
              totalHours += workHours;
              totalPoints += workHours * (emp.pointsPerHour || 1);

              name: emp.name,
              hours: totalHours,
              pointsPerHour: emp.pointsPerHour || 1,

// MODAL ÉDITION FEUILLE DE TEMPS
if (editingTimeSheet) {
  const emp = employees.find(e => e.id === editingTimeSheet.employeeId);
  
  // Calculer le coût estimé avec les nouvelles valeurs
  let estimatedCost = 0;
  let estimatedHours = 0;
  if (editTimeSheetDateIn && editTimeSheetTimeIn && editTimeSheetDateOut && editTimeSheetTimeOut) {
    try {
      const parseTime12to24 = (time12) => {
        const [time, period] = time12.trim().split(' ');
        let [hours, minutes] = time.split(':').map(Number);
        if (period.toUpperCase() === 'PM' && hours !== 12) hours += 12;
        else if (period.toUpperCase() === 'AM' && hours === 12) hours = 0;
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
      };
      
      const time24In = parseTime12to24(editTimeSheetTimeIn);
      const time24Out = parseTime12to24(editTimeSheetTimeOut);
      const inDateTime = new Date(editTimeSheetDateIn + 'T' + time24In);
      const outDateTime = new Date(editTimeSheetDateOut + 'T' + time24Out);
      const totalMinutes = (outDateTime - inDateTime) / (1000 * 60);
      const totalHours = totalMinutes / 60;
      
      const breakDuration = emp?.breakDuration || 30;
      const hourlyRate = emp?.hourlyRate || 16;
      const workHours = editTimeSheetBreakApplied ? totalHours - (breakDuration / 60) : totalHours;
      estimatedHours = totalHours;
      estimatedCost = workHours * hourlyRate * 1.168;
    } catch (error) {
      // Erreur de parsing, on ignore
    }
  }
  
  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">

              <p className="text-xs text-gray-500 mt-1">Format: 09:30 AM ou 02:45 PM</p>
            </div>

          <div className="grid grid-cols-2 gap-4">

              />
            </div>

    function MainDoeuvreTab({ employees, punchRecords, getEmployeeTimeSheetsForPeriod }) {
      const [mdoStartDate, setMdoStartDate] = React.useState(new Date().toISOString().split('T')[0]);
      const [mdoEndDate, setMdoEndDate] = React.useState(new Date().toISOString().split('T')[0]);
      const [mdoVentesResto, setMdoVentesResto] = React.useState('');
      const [mdoVentesFt, setMdoVentesFt] = React.useState('');
      const [mdoMode, setMdoMode] = React.useState('les2'); // 'restaurant', 'foodtruck', 'les2'

      const calcul = () => {
        const start = new Date(mdoStartDate);
        start.setHours(0, 0, 0, 0);
        const end = new Date(mdoEndDate);
        end.setHours(23, 59, 59, 999);

        let totalSalaireResto = 0;
        let totalSalaireFt = 0;
        let detailEmployes = [];

        employees.forEach(emp => {
          // Feuilles restaurant
          const sheetsResto = getEmployeeTimeSheetsForPeriod(emp.id, start, end, true);
          let heuresResto = 0;
          sheetsResto.forEach(sheet => {
            const h = (new Date(sheet.outRecord.timestamp) - new Date(sheet.inRecord.timestamp)) / 3600000;
            const breakApplied = h >= (emp.breakThreshold || 5);
            heuresResto += breakApplied ? h - ((emp.breakDuration || 30) / 60) : h;
          });
          const salaireResto = heuresResto * (emp.hourlyRate || 16);

          // Feuilles foodtruck (location === 'foodtruck')
          const sheetsFt = getEmployeeTimeSheetsForPeriod(emp.id, start, end, false).filter(s => s.inRecord.location === 'foodtruck');
          let heuresFt = 0;
          sheetsFt.forEach(sheet => {
            const h = (new Date(sheet.outRecord.timestamp) - new Date(sheet.inRecord.timestamp)) / 3600000;
            const breakApplied = h >= (emp.breakThreshold || 5);
            heuresFt += breakApplied ? h - ((emp.breakDuration || 30) / 60) : h;
          });
          const salaireFt = heuresFt * (emp.hourlyRate || 16);

          if (heuresResto > 0 || heuresFt > 0) {
            detailEmployes.push({
              name: emp.name,
              heuresResto: heuresResto,
              salaireResto: salaireResto,
              heuresFt: heuresFt,
              salaireFt: salaireFt
            });
          }

          totalSalaireResto += salaireResto;
          totalSalaireFt += salaireFt;
        });

        const dasResto = totalSalaireResto * 0.168;
        const dasFt = totalSalaireFt * 0.168;
        const coutTotalResto = totalSalaireResto + dasResto;
        const coutTotalFt = totalSalaireFt + dasFt;
        const coutTotal = coutTotalResto + coutTotalFt;

        const ventesResto = parseFloat(mdoVentesResto) || 0;
        const ventesFt = parseFloat(mdoVentesFt) || 0;
        const ventesTotales = ventesResto + ventesFt;

        return {
          detailEmployes,
          totalSalaireResto, dasResto, coutTotalResto,
          totalSalaireFt, dasFt, coutTotalFt,
          coutTotal,
          ventesResto, ventesFt, ventesTotales,
          pctResto: ventesResto > 0 ? (coutTotalResto / ventesResto * 100) : 0,
          pctFt: ventesFt > 0 ? (coutTotalFt / ventesFt * 100) : 0,
          pctTotal: ventesTotales > 0 ? (coutTotal / ventesTotales * 100) : 0
        };
      };

      const r = calcul();

      const showResto = mdoMode === 'restaurant' || mdoMode === 'les2';
      const showFt = mdoMode === 'foodtruck' || mdoMode === 'les2';

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-xl shadow-2xl p-6">
            <h2 className="text-2xl font-bold mb-6">💰 Coût de main d'œuvre</h2>

            {/* Filtres */}
            <div className="grid grid-cols-3 gap-4 mb-6">
              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-1">Date début</label>
                <input type="date" value={mdoStartDate} onChange={e => setMdoStartDate(e.target.value)}
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg" />
              </div>
              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-1">Date fin</label>
                <input type="date" value={mdoEndDate} onChange={e => setMdoEndDate(e.target.value)}
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg" />
              </div>
              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-1">Afficher</label>
                <select value={mdoMode} onChange={e => setMdoMode(e.target.value)}
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg">
                  <option value="les2">🍔🚚 Restaurant + Foodtruck</option>
                  <option value="restaurant">🍔 Restaurant seulement</option>
                  <option value="foodtruck">🚚 Foodtruck seulement</option>
                </select>
              </div>
            </div>

            {/* Ventes */}
            <div className="grid grid-cols-2 gap-4 mb-6">
              {showResto && (
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">🍔 Ventes restaurant ($)</label>
                  <input type="text" inputMode="decimal" value={mdoVentesResto}
                    onChange={e => setMdoVentesResto(e.target.value)}
                    placeholder="Ex: 12500.00"
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-lg" />
                </div>
              )}
              {showFt && (
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">🚚 Ventes foodtruck ($)</label>
                  <input type="text" inputMode="decimal" value={mdoVentesFt}
                    onChange={e => setMdoVentesFt(e.target.value)}
                    placeholder="Ex: 8000.00"
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-lg" />
                </div>
              )}
            </div>

            {/* Résultats */}
            <div className="grid gap-4">
              {showResto && (
                <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-5">
                  <h3 className="text-lg font-bold text-blue-800 mb-3">🍔 Restaurant</h3>
                  <div className="grid grid-cols-2 gap-3 text-sm">
                    <div className="bg-white rounded-lg p-3">
                      <div className="text-gray-500">Salaires bruts</div>
                      <div className="text-xl font-bold text-gray-800">{r.totalSalaireResto.toFixed(2)} $</div>
                    </div>
                    <div className="bg-white rounded-lg p-3">
                      <div className="text-gray-500">DAS (16.8%)</div>
                      <div className="text-xl font-bold text-orange-600">{r.dasResto.toFixed(2)} $</div>
                    </div>
                    <div className="bg-blue-600 text-white rounded-lg p-3">
                      <div className="opacity-80">Coût total</div>
                      <div className="text-2xl font-bold">{r.coutTotalResto.toFixed(2)} $</div>
                    </div>
                    <div className={`rounded-lg p-3 ${r.pctResto > 35 ? 'bg-red-100' : r.pctResto > 28 ? 'bg-yellow-100' : 'bg-green-100'}`}>
                      <div className="text-gray-600">% des ventes</div>
                      <div className={`text-2xl font-bold ${r.pctResto > 35 ? 'text-red-700' : r.pctResto > 28 ? 'text-yellow-700' : 'text-green-700'}`}>
                        {r.ventesResto > 0 ? r.pctResto.toFixed(1) + '%' : '—'}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {showFt && (
                <div className="bg-orange-50 border-2 border-orange-200 rounded-xl p-5">
                  <h3 className="text-lg font-bold text-orange-800 mb-3">🚚 Foodtruck</h3>
                  <div className="grid grid-cols-2 gap-3 text-sm">
                    <div className="bg-white rounded-lg p-3">
                      <div className="text-gray-500">Salaires bruts</div>
                      <div className="text-xl font-bold text-gray-800">{r.totalSalaireFt.toFixed(2)} $</div>
                    </div>
                    <div className="bg-white rounded-lg p-3">
                      <div className="text-gray-500">DAS (16.8%)</div>
                      <div className="text-xl font-bold text-orange-600">{r.dasFt.toFixed(2)} $</div>
                    </div>
                    <div className="bg-orange-600 text-white rounded-lg p-3">
                      <div className="opacity-80">Coût total</div>
                      <div className="text-2xl font-bold">{r.coutTotalFt.toFixed(2)} $</div>
                    </div>
                    <div className={`rounded-lg p-3 ${r.pctFt > 35 ? 'bg-red-100' : r.pctFt > 28 ? 'bg-yellow-100' : 'bg-green-100'}`}>
                      <div className="text-gray-600">% des ventes</div>
                      <div className={`text-2xl font-bold ${r.pctFt > 35 ? 'text-red-700' : r.pctFt > 28 ? 'text-yellow-700' : 'text-green-700'}`}>
                        {r.ventesFt > 0 ? r.pctFt.toFixed(1) + '%' : '—'}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {mdoMode === 'les2' && (
                <div className="bg-gray-800 text-white rounded-xl p-5">
                  <h3 className="text-lg font-bold mb-3">📊 Total combiné</h3>
                  <div className="grid grid-cols-3 gap-3 text-sm">
                    <div className="bg-gray-700 rounded-lg p-3">
                      <div className="opacity-70">Salaires bruts</div>
                      <div className="text-xl font-bold">{(r.totalSalaireResto + r.totalSalaireFt).toFixed(2)} $</div>
                    </div>
                    <div className="bg-gray-700 rounded-lg p-3">
                      <div className="opacity-70">DAS total</div>
                      <div className="text-xl font-bold text-orange-400">{(r.dasResto + r.dasFt).toFixed(2)} $</div>
                    </div>
                    <div className="bg-white text-gray-800 rounded-lg p-3">
                      <div className="text-gray-500">Coût total</div>
                      <div className="text-2xl font-bold">{r.coutTotal.toFixed(2)} $</div>
                    </div>
                    <div className={`col-span-3 rounded-lg p-3 text-center ${r.pctTotal > 35 ? 'bg-red-500' : r.pctTotal > 28 ? 'bg-yellow-500' : 'bg-green-500'}`}>
                      <div className="opacity-80 text-sm">% des ventes totales</div>
                      <div className="text-3xl font-bold">{r.ventesTotales > 0 ? r.pctTotal.toFixed(1) + '%' : '—'}</div>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Détail par employé */}
            {r.detailEmployes.length > 0 && (
              <div className="mt-6">
                <h3 className="text-lg font-bold mb-3 text-gray-700">Détail par employé</h3>
                <div className="overflow-x-auto">
                  <table className="w-full border-collapse text-sm">
                    <thead>
                      <tr className="bg-gray-100">
                        <th className="border border-gray-300 px-3 py-2 text-left">Employé</th>
                        {showResto && <th className="border border-gray-300 px-3 py-2 text-center bg-blue-50">🍔 Heures</th>}
                        {showResto && <th className="border border-gray-300 px-3 py-2 text-center bg-blue-50">Salaire</th>}
                        {showResto && <th className="border border-gray-300 px-3 py-2 text-center bg-blue-50">+ DAS</th>}
                        {showFt && <th className="border border-gray-300 px-3 py-2 text-center bg-orange-50">🚚 Heures</th>}
                        {showFt && <th className="border border-gray-300 px-3 py-2 text-center bg-orange-50">Salaire</th>}
                        {showFt && <th className="border border-gray-300 px-3 py-2 text-center bg-orange-50">+ DAS</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {r.detailEmployes.map((emp, i) => (
                        <tr key={i} className="hover:bg-gray-50">
                          <td className="border border-gray-300 px-3 py-2 font-semibold">{emp.name}</td>
                          {showResto && <td className="border border-gray-300 px-3 py-2 text-center bg-blue-50">{emp.heuresResto > 0 ? emp.heuresResto.toFixed(2) + 'h' : '—'}</td>}
                          {showResto && <td className="border border-gray-300 px-3 py-2 text-center bg-blue-50">{emp.salaireResto > 0 ? emp.salaireResto.toFixed(2) + ' $' : '—'}</td>}
                          {showResto && <td className="border border-gray-300 px-3 py-2 text-center bg-blue-50 font-semibold">{emp.salaireResto > 0 ? (emp.salaireResto * 1.168).toFixed(2) + ' $' : '—'}</td>}
                          {showFt && <td className="border border-gray-300 px-3 py-2 text-center bg-orange-50">{emp.heuresFt > 0 ? emp.heuresFt.toFixed(2) + 'h' : '—'}</td>}
                          {showFt && <td className="border border-gray-300 px-3 py-2 text-center bg-orange-50">{emp.salaireFt > 0 ? emp.salaireFt.toFixed(2) + ' $' : '—'}</td>}
                          {showFt && <td className="border border-gray-300 px-3 py-2 text-center bg-orange-50 font-semibold">{emp.salaireFt > 0 ? (emp.salaireFt * 1.168).toFixed(2) + ' $' : '—'}</td>}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {r.detailEmployes.length === 0 && (
              <div className="mt-6 text-center py-8 text-gray-400">
                Aucune donnée pour cette période
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<PunchClockApp />, document.getElementById('root'));
  </script>
</body>
</html>
